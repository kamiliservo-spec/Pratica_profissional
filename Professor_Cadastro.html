   <script>
function atualizarOrcamento() {

    let elementoOrcamento =
        document.getElementById("valorOrcamento");

    if (!elementoOrcamento) {
        return;
    }

    elementoOrcamento.textContent =
        orcamento.toLocaleString(
            "pt-BR",
            {
                style: "currency",
                currency: "BRL"
            }
        );
}

atualizarOrcamento();

    // =========================================
    // PESQUISAR ALUNO, PROFESSOR OU DISCIPLINA
    // =========================================

    function buscarCadastro() {

        let codigo = document
            .getElementById("codigoPesquisa")
            .value
            .trim()
            .toUpperCase();

        let tipo = document
            .getElementById("tipoPesquisa")
            .value;


        // =====================================
        // VERIFICA SE DIGITOU O CÓDIGO
        // =====================================

        if (codigo === "") {

            document.getElementById("resultadoPesquisa").innerHTML = `
                <p>
                    Digite o código do cadastro.
                </p>
            `;

            return;
        }


        // =====================================
        // ALUNO
        // =====================================

        if (tipo === "Aluno") {

            let aluno = alunos.find(a =>
                a.codigo === codigo
            );


            if (!aluno) {

                document.getElementById("resultadoPesquisa").innerHTML = `
                    <p>
                        Aluno não encontrado.
                    </p>
                `;

                return;
            }


            document.getElementById("resultadoPesquisa").innerHTML = `

                <h3>
                    Aluno encontrado
                </h3>

                <p>
                    <strong>Código:</strong>
                    ${aluno.codigo}
                </p>

                <p>
                    <strong>Nome:</strong>
                    ${aluno.nome}
                </p>

                <p>
                    <strong>Idade:</strong>
                    ${aluno.idade} anos
                </p>

                <p>
                    <strong>Turma:</strong>
                    ${aluno.turma}
                </p>

                <p>
                    <strong>E-mail:</strong>
                    ${aluno.email}
                </p>

            `;

            return;
        }


        // =====================================
        // PROFESSOR
        // =====================================

        if (tipo === "Professor") {

            let professor = professores.find(p =>
                p.codigo === codigo
            );


            if (!professor) {

                document.getElementById("resultadoPesquisa").innerHTML = `
                    <p>
                        Professor não encontrado.
                    </p>
                `;

                return;
            }


            // =====================================
            // FORMATA O SALÁRIO
            // =====================================

            let salarioFormatado =
                professor.salario.toLocaleString(
                    "pt-BR",
                    {
                        style: "currency",
                        currency: "BRL"
                    }
                );


            // =====================================
            // PROFESSOR NÃO PAGO
            // =====================================

            if (professor.pago === false) {

                document
                    .getElementById("resultadoPesquisa")
                    .innerHTML = `

                    <h3>
                        ${professor.nome}
                    </h3>

                    <p>
                        <strong>
                            Tipo:
                        </strong>

                        Professor
                    </p>

                    <p>
                        <strong>
                            Código:
                        </strong>

                        ${professor.codigo}
                    </p>

                    <p>
                        <strong>
                            Disciplina:
                        </strong>

                        ${professor.disciplina}
                    </p>

                    <p>
                        <strong>
                            Formação:
                        </strong>

                        ${professor.formacao}
                    </p>

                    <p>
                        <strong>
                            Salário:
                        </strong>

                        ${salarioFormatado}
                    </p>

                    <p>
                        <strong>
                            E-mail:
                        </strong>

                        ${professor.email}
                    </p>

                    <p class="professorNaoPago">

                        <strong>
                            Status:
                        </strong>

                        Pagamento pendente

                    </p>

                    <button
                        class="botao"
                        onclick="pagarProfessor('${professor.codigo}')"
                    >

                        Pagar professor

                    </button>

                `;

            }


            // =====================================
            // PROFESSOR JÁ PAGO
            // =====================================

            else {

                document
                    .getElementById("resultadoPesquisa")
                    .innerHTML = `

                    <h3>
                        ${professor.nome}
                    </h3>

                    <p>
                        <strong>
                            Tipo:
                        </strong>

                        Professor
                    </p>

                    <p>
                        <strong>
                            Código:
                        </strong>

                        ${professor.codigo}
                    </p>

                    <p>
                        <strong>
                            Disciplina:
                        </strong>

                        ${professor.disciplina}
                    </p>

                    <p>
                        <strong>
                            Formação:
                        </strong>

                        ${professor.formacao}
                    </p>

                    <p>
                        <strong>
                            Salário:
                        </strong>

                        ${salarioFormatado}
                    </p>

                    <p>
                        <strong>
                            E-mail:
                        </strong>

                        ${professor.email}
                    </p>

                    <p class="professorPago">

                        <strong>
                            Status:
                        </strong>

                        Pagamento realizado

                    </p>

                `;

            }


            return;
        }


        // =====================================
        // DISCIPLINA
        // =====================================

        if (tipo === "Disciplina") {

            let disciplina = disciplinas.find(d =>
                d.codigo === codigo
            );


            if (!disciplina) {

                document.getElementById("resultadoPesquisa").innerHTML = `
                    <p>
                        Disciplina não encontrada.
                    </p>
                `;

                return;
            }


            // Procura o professor responsável

            let professor = professores.find(p =>
                p.codigo === disciplina.professorCodigo
            );


            document.getElementById("resultadoPesquisa").innerHTML = `

                <h3>
                    Disciplina encontrada
                </h3>

                <p>
                    <strong>
                        Código:
                    </strong>

                    ${disciplina.codigo}
                </p>

                <p>
                    <strong>
                        Nome:
                    </strong>

                    ${disciplina.nome}
                </p>

                <p>
                    <strong>
                        Carga Horária:
                    </strong>

                    ${disciplina.cargaHoraria}
                </p>

                <p>
                    <strong>
                        Professor:
                    </strong>

                    ${professor
                        ? professor.nome
                        : "Não informado"
                    }
                </p>

                <p>
                    <strong>
                        Dia:
                    </strong>

                    ${disciplina.diaSemana}
                </p>

                <p>
                    <strong>
                        Horário:
                    </strong>

                    ${disciplina.horaInicio}
                    às
                    ${disciplina.horaFim}
                </p>

            `;

            return;
        }

    }


    // =================================================
    // PAGAR PROFESSOR
    // =================================================

   // =================================================
// PAGAR PROFESSOR
// =================================================

function pagarProfessor(codigo) {

    // =============================================
    // PROCURA O PROFESSOR
    // =============================================

    let professor = professores.find(function(p) {

        return p.codigo === codigo;

    });


    // =============================================
    // VERIFICA SE EXISTE
    // =============================================

    if (!professor) {

        alert("Professor não encontrado.");

        return;
    }


    // =============================================
    // VERIFICA SE JÁ FOI PAGO
    // =============================================

    if (professor.pago === true) {

        alert("Este professor já foi pago.");

        return;
    }


    // =============================================
    // VERIFICA O SALÁRIO
    // =============================================

    if (
        typeof professor.salario !== "number" ||
        professor.salario <= 0
    ) {

        alert("Este professor não possui um salário válido.");

        return;
    }


    // =============================================
    // VERIFICA O ORÇAMENTO
    // =============================================

    if (professor.salario > orcamento) {

        alert(
            "Não há orçamento suficiente para pagar este professor."
        );

        return;
    }


    // =============================================
    // FORMATA O SALÁRIO
    // =============================================

    let salarioFormatado =
        professor.salario.toLocaleString(
            "pt-BR",
            {
                style: "currency",
                currency: "BRL"
            }
        );


    // =============================================
    // CONFIRMA PAGAMENTO
    // =============================================

    let confirmar = confirm(

        "Deseja pagar " +
        professor.nome +
        " no valor de " +
        salarioFormatado +
        "?"

    );


    if (!confirmar) {

        return;
    }


    // =============================================
    // DESCONTA O SALÁRIO
    // =============================================

    orcamento -= professor.salario;


    // =============================================
    // MARCA COMO PAGO
    // =============================================

    professor.pago = true;


    // =============================================
    // FORMATA ORÇAMENTO RESTANTE
    // =============================================

    let orcamentoFormatado =
        orcamento.toLocaleString(
            "pt-BR",
            {
                style: "currency",
                currency: "BRL"
            }
        );


    // =============================================
    // ATUALIZA ORÇAMENTO
    // =============================================

    atualizarOrcamento();


    // =============================================
    // MOSTRA O RESULTADO
    // =============================================

    document
        .getElementById("resultadoPesquisa")
        .innerHTML = `

        <h3>
            ${professor.nome}
        </h3>

        <p>
            <strong>
                Tipo:
            </strong>

            Professor
        </p>

        <p>
            <strong>
                Código:
            </strong>

            ${professor.codigo}
        </p>

        <p>
            <strong>
                Disciplina:
            </strong>

            ${professor.disciplina}
        </p>

        <p>
            <strong>
                Formação:
            </strong>

            ${professor.formacao}
        </p>

        <p>
            <strong>
                Salário:
            </strong>

            ${salarioFormatado}
        </p>

        <p>
            <strong>
                E-mail:
            </strong>

            ${professor.email}
        </p>

        <p class="professorPago">

            <strong>
                Status:
            </strong>

            Pagamento realizado!

        </p>

        <p>

            <strong>
                Orçamento restante:
            </strong>

            ${orcamentoFormatado}

        </p>

    `;


    // =============================================
    // MENSAGEM
    // =============================================

    let mensagemPagamento =
        document.getElementById("mensagemPagamento");


    if (mensagemPagamento) {

        mensagemPagamento.innerHTML = `

            <p style="color: #90ee90;">

                Pagamento realizado com sucesso!

            </p>

        `;

    }

}

    // =========================================
    // CADASTRAR ALUNO
    // =========================================

    function cadastrar() {

        let codigo =
            document.getElementById("inputCodigo").value
            .trim()
            .toUpperCase();

        let nome =
            document.getElementById("inputNome").value.trim();

        let cpf =
            document.getElementById("inputCPF").value.trim();

        let endereco =
            document.getElementById("inputEndereco").value.trim();

        let responsavel =
            document.getElementById("inputResponsavel").value.trim();

        let email =
            document.getElementById("inputEmail").value.trim();

        let telefone =
            document.getElementById("inputTelefone").value.trim();

        let nascimento =
            document.getElementById("inputNascimento").value;

        let genero =
            document.getElementById("inputGenero").value.trim();

        let ano =
            document.getElementById("inputAno").value.trim();

        let turma =
            document.getElementById("inputTurma").value.trim();


        // =====================================
        // VERIFICAÇÃO DOS CAMPOS
        // =====================================

        if (
            codigo === "" ||
            nome === "" ||
            cpf === "" ||
            endereco === "" ||
            responsavel === "" ||
            email === "" ||
            telefone === "" ||
            nascimento === "" ||
            genero === "" ||
            ano === "" ||
            turma === ""
        ) {

            document
                .getElementById("resultadoCadastro")
                .innerHTML = `

                <p>
                    Preencha todos os campos antes de cadastrar.
                </p>

            `;

            return;
        }


        // =====================================
        // VERIFICA SE O CÓDIGO JÁ EXISTE
        // =====================================

        let alunoExistente = alunos.find(a =>
            a.codigo === codigo
        );


        if (alunoExistente) {

            document
                .getElementById("resultadoCadastro")
                .innerHTML = `

                <p>

                    Já existe um aluno com o código
                    <strong>${codigo}</strong>.

                </p>

            `;

            return;
        }


        // =====================================
        // CRIA O NOVO ALUNO
        // =====================================

        let novoAluno = {

            codigo: codigo,

            nome: nome,

            cpf: cpf,

            endereco: endereco,

            responsavel: responsavel,

            email: email,

            telefone: telefone,

            nascimento: nascimento,

            genero: genero,

            ano: ano,

            turma: turma

        };


        // Adiciona ao banco

        alunos.push(novoAluno);
exportarAlunosCSV();

        // =====================================
        // MOSTRA O ALUNO CADASTRADO
        // =====================================

        document
            .getElementById("resultadoCadastro")
            .innerHTML = `

            <h3>
                Aluno cadastrado com sucesso!
            </h3>

            <p>
                <strong>Código:</strong>
                ${novoAluno.codigo}
            </p>

            <p>
                <strong>Nome:</strong>
                ${novoAluno.nome}
            </p>

            <p>
                <strong>CPF:</strong>
                ${novoAluno.cpf}
            </p>

            <p>
                <strong>Endereço:</strong>
                ${novoAluno.endereco}
            </p>

            <p>
                <strong>Responsável:</strong>
                ${novoAluno.responsavel}
            </p>

            <p>
                <strong>E-mail:</strong>
                ${novoAluno.email}
            </p>

            <p>
                <strong>Telefone:</strong>
                ${novoAluno.telefone}
            </p>

            <p>
                <strong>Data de nascimento:</strong>
                ${novoAluno.nascimento}
            </p>

            <p>
                <strong>Gênero:</strong>
                ${novoAluno.genero}
            </p>

            <p>
                <strong>Ano:</strong>
                ${novoAluno.ano}
            </p>

            <p>
                <strong>Turma:</strong>
                ${novoAluno.turma}
            </p>

        `;


        limparCadastro();

    }


    // =========================================
    // LIMPAR FORMULÁRIO
    // =========================================

    function limparCadastro() {

        document.getElementById("inputCodigo").value = "";

        document.getElementById("inputNome").value = "";

        document.getElementById("inputCPF").value = "";

        document.getElementById("inputEndereco").value = "";

        document.getElementById("inputResponsavel").value = "";

        document.getElementById("inputEmail").value = "";

        document.getElementById("inputTelefone").value = "";

        document.getElementById("inputNascimento").value = "";

        document.getElementById("inputGenero").value = "";

        document.getElementById("inputAno").value = "";

        document.getElementById("inputTurma").value = "";

    }
function exportarAlunosCSV() {

    let csv =
    "codigo,nome,cpf,endereco,responsavel,email,telefone,nascimento,genero,ano,turma\n";

    alunos.forEach(aluno => {

        csv +=
        `"${aluno.codigo}",` +
        `"${aluno.nome}",` +
        `"${aluno.cpf}",` +
        `"${aluno.endereco}",` +
        `"${aluno.responsavel}",` +
        `"${aluno.email}",` +
        `"${aluno.telefone}",` +
        `"${aluno.nascimento}",` +
        `"${aluno.genero}",` +
        `"${aluno.ano}",` +
        `"${aluno.turma}"\n`;

    });

    const blob = new Blob([csv], {
        type: "text/csv;charset=utf-8;"
    });

    const link = document.createElement("a");

    link.href = URL.createObjectURL(blob);

    link.download = "alunos.csv";

    link.click();
}

</script>
